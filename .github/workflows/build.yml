name: Build Windows & macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build & package Windows installer
        shell: bash
        run: npx electron-vite build && npx electron-builder --win --publish never --config.extraMetadata.version="$APP_VERSION"

      - name: Verify packaged binaries
        shell: pwsh
        run: |
          Get-Item "dist\win-unpacked\resources\bin\ffmpeg.exe" | Select-Object FullName,Length
          & "dist\win-unpacked\resources\bin\ffmpeg.exe" -version | Select-Object -First 1
          & "dist\win-unpacked\resources\bin\ffprobe.exe" -version | Select-Object -First 1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-trimmer-windows
          path: |
            dist/*.exe
            dist/*.blockmap

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --draft=false
          gh release upload ${{ github.ref_name }} dist/*.exe --clobber

  build-mac:
    runs-on: macos-14
    needs: build-win
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build & package macOS app
        run: npx electron-vite build && npx electron-builder --mac --publish never --config.extraMetadata.version="$APP_VERSION"

      - name: Verify packaged binaries
        run: |
          ls -la "dist/mac-arm64/VideoTrimmer.app/Contents/Resources/bin/"
          "dist/mac-arm64/VideoTrimmer.app/Contents/Resources/bin/ffmpeg" -version | head -1
          "dist/mac-arm64/VideoTrimmer.app/Contents/Resources/bin/ffprobe" -version | head -1

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-trimmer-macos
          path: dist/*.dmg

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --draft=false
          gh release upload ${{ github.ref_name }} dist/*.dmg --clobber
